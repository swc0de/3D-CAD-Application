name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libraries for Qt / OpenGL and a virtual display
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          xvfb libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4
          libxcb-keysyms1 libxcb-shape0 libxcb-render-util0 libxcb-image0
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check pymodeler tests
      - name: Test (under a virtual X server so the OpenGL viewport is exercised)
        run: xvfb-run -a pytest
