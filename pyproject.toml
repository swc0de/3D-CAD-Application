[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymodeler"
version = "0.1.0"
description = "A SketchUp-style 3D modeler in pure Python, scriptable with JSON build scripts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "jsonschema>=4.18",
    "Pillow>=10.0",
    "moderngl>=5.8",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "trimesh>=4.0",
    "ruff>=0.5",
]

[project.scripts]
pymodeler = "pymodeler.cli:main"

[tool.setuptools.packages.find]
include = ["pymodeler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "B"]
